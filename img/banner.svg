<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <radialGradient id="glow" cx="18%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="#050505"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect x="0" y="318" width="1280" height="2" fill="url(#line)"/>

  <!-- gráfico decorativo -->
  <path d="M880 250 L940 214 L1000 228 L1060 176 L1120 190 L1180 132 L1240 146"
        fill="none" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="1240" cy="146" r="6" fill="#f59e0b"/>
  <circle cx="1240" cy="146" r="13" fill="none" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="2"/>

  <!-- bandera de Bolivia, discreta -->
  <g opacity="0.85" transform="translate(80,52)">
    <rect width="52" height="12" rx="2" fill="#d52b1e"/>
    <rect y="12" width="52" height="12" fill="#f9e300"/>
    <rect y="24" width="52" height="12" rx="2" fill="#007934"/>
  </g>

  <text x="80" y="146" font-size="62" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    DÓLAR<tspan fill="#f59e0b">BOLIVIA</tspan>
  </text>

  <text x="80" y="196" font-size="21" font-weight="500" fill="#ffffff" fill-opacity="0.62">
    Cotización paralela y oficial, en tiempo real y sin servidor.
  </text>

  <g font-size="15" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" fill="#f59e0b" fill-opacity="0.75">
    <text x="80" y="248">PARALELO · OFICIAL BCB · 8 EXCHANGES</text>
    <text x="80" y="274" font-size="14" fill="#ffffff" fill-opacity="0.35">dolarbolivia.site</text>
  </g>

  <!-- píldora "en vivo" -->
  <g transform="translate(1080,52)">
    <rect width="120" height="34" rx="17" fill="#f59e0b" fill-opacity="0.10" stroke="#f59e0b" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="5" fill="#4ade80"/>
    <text x="34" y="22" font-size="14" font-family="ui-monospace,monospace" fill="#f59e0b" font-weight="600">EN VIVO</text>
  </g>
</svg>
