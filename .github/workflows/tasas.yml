name: tasas

# Actualiza el precio del dólar cada 10 minutos y lo deja como archivo estático en el repo:
# así el sitio vive en GitHub Pages, sin VPS y sin costo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "tools/tasas.py"
      - ".github/workflows/tasas.yml"

permissions:
  contents: write

jobs:
  tasas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Traer cotizaciones
        # --sin-muestra: el CSV de las velas lo escribe tools/muestra.py (workflow muestreo).
        # Un solo escritor por archivo, así no hay conflictos de rebase.
        run: python tools/tasas.py --sin-muestra
      - name: Actualizar las velas del gráfico USDT/BOB
        # historial.py cosecha lo que falte de docs/history.json, agrupa en velas de 15 min
        # y escribe docs/api/historial.json (lo que dibuja el gráfico del sitio).
        run: python tools/historial.py --minutos 15
      - name: Armar el dataset del gráfico interactivo
        # velas base de 5 min + serie del oficial para /grafico/ (agrega y recorta en el navegador)
        run: python tools/grafico.py
      - name: Guardar en el repo
        run: |
          git config user.name "DolarBolivia"
          git config user.email "bot@users.noreply.github.com"
          git add docs/api/rates docs/history.json docs/api/historial.json docs/api/grafico.json
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "tasas $(date -u '+%Y-%m-%d %H:%M UTC')"
          # rebase + reintento: si alguien empujó mientras corría, el push directo se rechaza
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "tasas guardadas"
              break
            fi
            echo "reintento $i..."
            sleep 5
          done
