<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ambar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f09209"/>
    </linearGradient>
  </defs>

  <!-- placa redondeada, tema del sitio -->
  <rect width="512" height="512" rx="116" fill="url(#fondo)"/>
  <rect x="10" y="10" width="492" height="492" rx="108" fill="none"
        stroke="#f59e0b" stroke-opacity="0.20" stroke-width="8"/>

  <!-- signo peso/dólar en ámbar -->
  <text x="256" y="352" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif"
        font-size="322" font-weight="800" fill="url(#ambar)">$</text>

  <!-- tilde ascendente: la cotización que sube -->
  <path d="M348 150 L392 108 L436 150" fill="none" stroke="#4ade80"
        stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
